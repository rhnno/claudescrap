# Enhanced Analyzer Configuration Template
# This configuration allows rich feature extraction examples for better ML training

# Core paths and model settings
paths:
  model_dir: models
  training_data_file: models/training_data.csv
  model_file: pagination_model.pkl
  vectorizer_file: pagination_vectorizer.pkl
  feature_templates_dir: config/feature_templates

# Enhanced feature extraction configuration
features:
  # Text analysis with rich pattern matching
  text_analysis:
    max_tfidf_features: 200
    stop_words: english
    min_df: 2
    max_df: 0.95
    ngram_range: [1, 2]  # Include bigrams for better context
    
    # Comprehensive end-of-results patterns with confidence scores
    end_of_results_patterns:
      high_confidence:
        - pattern: "no\\s+more\\s+results"
          weight: 0.9
          languages: ["english"]
        - pattern: "end\\s+of\\s+results"
          weight: 0.9
          languages: ["english"]
        - pattern: "tidak\\s+ada\\s+hasil\\s+lagi"
          weight: 0.9
          languages: ["indonesian"]
        - pattern: "semua\\s+produk\\s+telah\\s+ditampilkan"
          weight: 0.85
          languages: ["indonesian"]
      
      medium_confidence:
        - pattern: "no\\s+more\\s+items"
          weight: 0.7
          languages: ["english"]
        - pattern: "that's\\s+all\\s+folks"
          weight: 0.6
          languages: ["english"]
        - pattern: "hasil\\s+pencarian\\s+habis"
          weight: 0.7
          languages: ["indonesian"]
      
      low_confidence:
        - pattern: "end\\s+of\\s+page"
          weight: 0.4
          languages: ["english", "indonesian"]

    # Pagination indicator patterns
    pagination_text_patterns:
      strong_indicators:
        - pattern: "page\\s+\\d+\\s+of\\s+\\d+"
          weight: 0.95
          feature_name: "strong_pagination_text"
        - pattern: "halaman\\s+\\d+\\s+dari\\s+\\d+"
          weight: 0.95
          feature_name: "strong_pagination_text"
        - pattern: "showing\\s+\\d+\\s*-\\s*\\d+\\s+of\\s+\\d+"
          weight: 0.9
          feature_name: "results_range_text"
      
      weak_indicators:
        - pattern: "next\\s+page"
          weight: 0.6
          feature_name: "next_page_text"
        - pattern: "previous\\s+page"
          weight: 0.6
          feature_name: "prev_page_text"

  # Enhanced selector configuration with priority and context
  selectors:
    pagination_buttons:
      primary:
        - selector: "nav[aria-label*='pagination'] button"
          priority: 10
          context: "semantic_navigation"
        - selector: ".pagination button:not([disabled])"
          priority: 9
          context: "bootstrap_style"
        - selector: "button[class*='pagination']:not([disabled])"
          priority: 8
          context: "class_based"
      
      secondary:
        - selector: "a[class*='pagination']"
          priority: 7
          context: "link_based"
        - selector: "[aria-label*='pagination']"
          priority: 6
          context: "accessibility"
      
      fallback:
        - selector: "button[aria-label*='page']"
          priority: 3
          context: "aria_fallback"

    next_buttons:
      primary:
        - xpath: "//button[contains(@aria-label, 'next') or contains(@aria-label, 'Next')]"
          priority: 10
          context: "accessibility_next"
        - xpath: "//a[contains(@aria-label, 'next') or contains(@aria-label, 'Next')]"
          priority: 9
          context: "link_accessibility"
      
      secondary:
        - xpath: "//button[contains(text(), 'Next') or contains(text(), 'next')]"
          priority: 8
          context: "text_based"
        - xpath: "//button[contains(text(), '›') or contains(text(), '→')]"
          priority: 7
          context: "symbol_based"
      
      tertiary:
        - xpath: "//a[contains(text(), 'Next') or contains(text(), 'next')]"
          priority: 6
          context: "link_text"

    load_more_buttons:
      primary:
        - xpath: "//button[contains(text(), 'Load More') or contains(text(), 'Show More')]"
          priority: 10
          context: "explicit_load_more"
        - xpath: "//button[contains(text(), 'Muat') or contains(text(), 'Tampilkan Lebih')]"
          priority: 10
          context: "indonesian_load_more"
      
      secondary:
        - selector: "button[data-testid*='load-more']"
          priority: 8
          context: "testid_based"
        - selector: ".load-more-btn, .show-more-btn"
          priority: 7
          context: "class_based"

    lazy_load_elements:
      images:
        - selector: "img[data-lazy], img[loading='lazy']"
          priority: 10
          context: "lazy_images"
        - selector: "img[data-src]:not([src])"
          priority: 9
          context: "deferred_images"
      
      content:
        - selector: ".lazy, .skeleton, .shimmer"
          priority: 8
          context: "loading_placeholders"
        - selector: "[data-lazy-load], [data-defer]"
          priority: 7
          context: "data_attributes"
      
      containers:
        - selector: ".loading-placeholder, .content-loader"
          priority: 6
          context: "loading_containers"

    product_elements:
      primary:
        - selector: "[data-testid*='product'], [data-testid*='item']"
          priority: 10
          context: "testid_products"
        - selector: ".product-card, .item-card"
          priority: 9
          context: "card_based"
      
      secondary:
        - selector: "[class*='product']:not([class*='product-detail'])"
          priority: 8
          context: "class_products"
        - selector: "[class*='item']:not([class*='menu-item'])"
          priority: 7
          context: "class_items"
      
      fallback:
        - selector: "article, .listing-item"
          priority: 5
          context: "semantic_fallback"

  # Advanced thresholds with adaptive behavior
  thresholds:
    confidence_threshold: 0.7
    footer_threshold_ratio: 0.8
    scroll_bottom_threshold: 0.95
    max_infinite_scroll_rounds: 15
    consecutive_infinite_limit: 5
    
    # Dynamic threshold adjustment
    adaptive_thresholds:
      enable: true
      confidence_decay: 0.05  # Reduce confidence threshold if no high-confidence predictions
      min_confidence: 0.5
      scroll_patience: 3  # Rounds to wait before declaring end of infinite scroll

  # Enhanced dynamic feature extraction
  dynamic_features:
    scroll_behavior:
      track_velocity: true
      track_acceleration: true
      velocity_window: 5  # Number of measurements for velocity calculation
      detect_smooth_scrolling: true
    
    dom_monitoring:
      track_node_additions: true
      track_node_removals: true
      monitor_attribute_changes: true
      significant_change_threshold: 10  # Minimum nodes for significant change
    
    network_activity:
      monitor_xhr_requests: true
      monitor_fetch_requests: true
      track_image_loads: true
      request_timeout_window: 5000  # ms
    
    user_interaction:
      detect_hover_effects: true
      track_focus_changes: true
      monitor_scroll_events: true

# Enhanced site-specific configurations
sites:
  tokopedia:
    base_url: "https://www.tokopedia.com/search?q={query}"
    language: "indonesian"
    encoding: "utf-8"
    
    # Site-specific feature weights
    feature_weights:
      pagination_buttons: 1.2
      lazy_load_elements: 1.5
      text_patterns: 1.1
    
    # Custom patterns for this site
    patterns:
      page_text: 
        - "halaman"
        - "produk"
        - "hasil pencarian"
      end_results: 
        - "tidak ada hasil lagi"
        - "hasil pencarian habis"
        - "produk tidak ditemukan"
      pagination_indicators:
        - "halaman \\d+"
        - "dari \\d+ halaman"
    
    # Site-specific selectors
    custom_selectors:
      product_container: "div.css-5wh65g"
      pagination_container: "div.css-dvxtzn" 
      infinite_container: "div.css-dvxtzn" # tokopedia infinite scroll container
      load_more_trigger: "button.css-1turmok-unf-btn.eg8apji0"
    
    # Performance settings
    performance:
      page_load_timeout: 30
      element_wait_timeout: 10
      scroll_pause_time: 2

  amazon:
    base_url: "https://www.amazon.com/s?k={query}"
    language: "english"
    encoding: "utf-8"
    
    feature_weights:
      pagination_buttons: 1.3
      numbered_buttons: 1.4
      url_params: 1.2
    
    patterns:
      page_text: 
        - "page"
        - "results"
        - "of over"
      end_results: 
        - "no more results"
        - "end of results"
        - "no results found"
      pagination_indicators:
        - "page \\d+ of"
        - "\\d+-\\d+ of over"
    
    custom_selectors:
      product_container: "div.puis-card-container"
      pagination_container: "div.s-pagination-container"
      next_button: "a.s-pagination-item svg"
    
    performance:
      page_load_timeout: 25
      element_wait_timeout: 8
      scroll_pause_time: 1.5

  shopee:
    base_url: "https://shopee.co.id/search?keyword={query}"
    language: "indonesian"
    encoding: "utf-8"
    
    feature_weights:
      lazy_load_elements: 2.0
      scroll_velocity: 1.5
      xhr_request_count: 1.3
    
    patterns:
      page_text: 
        - "halaman"
        - "produk"
        - "hasil"
      end_results: 
        - "tidak ada produk lagi"
        - "akhir hasil pencarian"
      infinite_scroll_indicators:
        - "memuat lebih banyak"
        - "loading"
    
    custom_selectors:
      product_container: ".shopee-search-item-result__item"
      infinite_scroll_trigger: ".shopee-button-outline"
    
    performance:
      page_load_timeout: 35
      element_wait_timeout: 12
      scroll_pause_time: 3

# Training configuration with enhanced options
training:
  test_size: 0.2
  random_state: 42
  n_estimators: 150
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  
  # Enhanced training features
  feature_engineering:
    enable_feature_selection: true
    feature_selection_k: 50
    enable_pca: false
    pca_components: 0.95
    
    # Automatic feature creation
    create_interaction_features: true
    create_polynomial_features: false
    polynomial_degree: 2
  
  # Cross-validation settings
  cross_validation:
    enable: true
    cv_folds: 5
    scoring: ["accuracy", "f1_macro", "precision_macro", "recall_macro"]
  
  # Model ensemble
  ensemble:
    enable: true
    models:
      - name: "random_forest"
        params:
          n_estimators: 150
          max_depth: 15
        weight: 0.4
      - name: "gradient_boosting"
        params:
          n_estimators: 100
          learning_rate: 0.1
        weight: 0.3
      - name: "svm"
        params:
          kernel: "rbf"
          C: 1.0
        weight: 0.3
  
  # Automated data collection
  auto_collect_samples: true
  samples_per_site: 30
  max_training_samples: 1000
  
  # Data quality controls
  data_quality:
    remove_duplicates: true
    handle_missing_values: true
    outlier_detection: true
    balance_classes: true

# Debug and monitoring configuration
debug:
  verbose: true
  save_features: true
  feature_summary: true
  save_predictions: true
  log_level: "INFO"
  
  # Performance monitoring
  performance_monitoring:
    enable: true
    track_extraction_time: true
    track_prediction_time: true
    track_memory_usage: true
  
  # Feature analysis
  feature_analysis:
    enable: true
    save_feature_importance: true
    create_feature_correlation_matrix: true
    generate_feature_distribution_plots: false
  
  # Model evaluation
  model_evaluation:
    enable: true
    save_confusion_matrix: true
    save_classification_report: true
    save_learning_curves: false

# Export and integration settings
export:
  formats: ["json", "csv", "pickle"]
  include_metadata: true
  compress_exports: true
  
  # API integration
  api_integration:
    enable: false
    webhook_url: ""
    api_key: ""
    batch_size: 100