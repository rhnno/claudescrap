# Enhanced Training Templates for ML-Powered Web Scraper
# This file provides rich, configurable examples for training the pagination detection model

training_templates:
  # === E-Commerce Site Templates ===
  ecommerce_sites:
    tokopedia:
      base_config:
        name: "Tokopedia Indonesia"
        language: "indonesian"
        encoding: "utf-8"
        base_url: "https://www.tokopedia.com/search?q={query}"
        
      # Weighted selector configuration for better feature extraction
      selectors:
        pagination_buttons:
          high_confidence:
            - selector: "button[class*='css-1turmok-unf-btn'][class*='eg8apji0']"
              priority: 10
              context: "tokopedia_main_pagination"
              weight: 0.95
            - selector: "button[class='css-dzvl4q-unf-pagination-item']"
              priority: 9
              context: "tokopedia_numbered_pagination"
              weight: 0.9
          medium_confidence:
            - selector: "button[aria-label*='Laman berikutnya']"
              priority: 7
              context: "tokopedia_aria_next"
              weight: 0.8
            - selector: ".pagination button:not([disabled])"
              priority: 6
              context: "generic_pagination"
              weight: 0.7
          low_confidence:
            - selector: "button[class*='pagination']"
              priority: 4
              context: "generic_pagination_class"
              weight: 0.5
              
        next_buttons:
          high_confidence:
            - xpath: "//button[contains(@aria-label, 'Laman berikutnya')]"
              priority: 10
              context: "tokopedia_aria_next"
              weight: 0.95
            - xpath: "//button[contains(text(), '›')]"
              priority: 9
              context: "arrow_next"
              weight: 0.9
          medium_confidence:
            - xpath: "//button[contains(text(), 'Selanjutnya')]"
              priority: 7
              context: "indonesian_next"
              weight: 0.8
            - xpath: "//a[contains(@class, 'next')]"
              priority: 6
              context: "link_next"
              weight: 0.7
              
        infinite_scroll_indicators:
          high_confidence:
            - selector: "[data-testid*='infinite-scroll']"
              priority: 10
              context: "tokopedia_infinite_scroll"
              weight: 0.95
            - selector: ".css-1g5t3wv" # Tokopedia loading skeleton
              priority: 9
              context: "tokopedia_skeleton"
              weight: 0.9
          medium_confidence:
            - selector: "[class*='loading'], [class*='skeleton']"
              priority: 7
              context: "generic_loading"
              weight: 0.8
            - selector: "[data-lazy='true']"
              priority: 6
              context: "lazy_loading"
              weight: 0.7
              
        product_containers:
          primary:
            - selector: "div[class*='css-5wh65g']" # Main product card
              priority: 10
              context: "tokopedia_product_card"
              weight: 1.0
          secondary:
            - selector: "[data-testid*='product']"
              priority: 8
              context: "product_testid"
              weight: 0.8
            - selector: ".product-item, .item-card"
              priority: 6
              context: "generic_product"
              weight: 0.6

        product_details:
          high_confidence:
            - name: "link"
              xpath: ".//a[contains(@href, '/')]"
              type: "attribute"
              attribute: "href"
            - name: "name"
              xpath: ".//*[contains(@class,'tnoqZhn89')]"
              type: "text"
            - name: "price"
              xpath: ".//*[contains(@class, 'urMOIDHH7')]"
              type: "text"
            - name: "discount"
              xpath: ".//*[contains(@class, 'discount')]"
              type: "text"
            - name: "before_discount_price"
              xpath: ".//*[contains(@class, 'before-discount')]"
              type: "text"
            - name: "sold"
              xpath: ".//*[contains(text(), 'terjual')]"
              type: "text"
            - name: "shop_name"
              xpath: ".//*[contains(@class, 'si3CNdiG8AR0EaXvf6bFbQ')]"
              type: "text"
            - name: "rating"
              xpath: ".//*[contains(@class, '55aCJ8bEsyw')]"
              type: "text"
            - name: "location"
              xpath: ".//*[contains(@class, 'location')]"
              type: "text"
              
      # Enhanced text analysis patterns with confidence scoring
      text_patterns:
        end_of_results:
          high_confidence:
            - pattern: "tidak\\s+ada\\s+produk\\s+lagi"
              weight: 0.95
              feature_name: "tokopedia_no_more_products"
            - pattern: "hasil\\s+pencarian\\s+habis"
              weight: 0.9
              feature_name: "tokopedia_search_exhausted"
          medium_confidence:
            - pattern: "semua\\s+produk\\s+telah\\s+ditampilkan"
              weight: 0.8
              feature_name: "tokopedia_all_shown"
            - pattern: "tidak\\s+ditemukan\\s+hasil"
              weight: 0.7
              feature_name: "tokopedia_no_results"
          low_confidence:
            - pattern: "maaf.*tidak.*ditemukan"
              weight: 0.5
              feature_name: "tokopedia_sorry_not_found"
              
        pagination_text:
          high_confidence:
            - pattern: "halaman\\s+(\\d+)\\s+dari\\s+(\\d+)"
              weight: 0.95
              feature_name: "tokopedia_page_of_total"
              extract_numbers: true
            - pattern: "menampilkan\\s+(\\d+)\\s+dari\\s+(\\d+)\\s+produk"
              weight: 0.9
              feature_name: "tokopedia_showing_products"
              extract_numbers: true
          medium_confidence:
            - pattern: "halaman\\s+(\\d+)"
              weight: 0.8
              feature_name: "tokopedia_page_number"
              extract_numbers: true
            - pattern: "(\\d+)\\s+produk\\s+ditemukan"
              weight: 0.7
              feature_name: "tokopedia_products_found"
              extract_numbers: true
              
        infinite_scroll_text:
          high_confidence:
            - pattern: "memuat\\s+lebih\\s+banyak"
              weight: 0.9
              feature_name: "tokopedia_load_more"
            - pattern: "gulir\\s+untuk\\s+melihat\\s+lebih"
              weight: 0.85
              feature_name: "tokopedia_scroll_more"
          medium_confidence:
            - pattern: "loading.*produk"
              weight: 0.7
              feature_name: "tokopedia_loading_products"
              
      # Training scenarios with expected outcomes
      training_scenarios:
        pagination_examples:
          scenario_1:
            description: "First page with clear pagination"
            url_pattern: "search?q={query}&page=1"
            expected_features:
              pagination_buttons: ">= 3"
              next_button: ">= 1"
              numbered_buttons: ">= 5"
              pagination_at_footer: 1
              contains_page_numbers: 1
            expected_type: "pagination"
            confidence_threshold: 0.9
            
          scenario_2:
            description: "Middle page with pagination"
            url_pattern: "search?q={query}&page={2-50}"
            expected_features:
              pagination_buttons: ">= 5"
              next_button: ">= 1"
              numbered_buttons: ">= 7"
              url_has_page_param: 1
            expected_type: "pagination"
            confidence_threshold: 0.95
            
          scenario_3:
            description: "Last page with disabled next"
            url_pattern: "search?q={query}&page={high_number}"
            expected_features:
              pagination_buttons: ">= 3"
              next_button: 0
              has_end_of_results_text: 1
            expected_type: "last_page"
            confidence_threshold: 0.9
            
        infinite_scroll_examples:
          scenario_1:
            description: "Infinite scroll with lazy loading"
            url_pattern: "search?q={query}"
            expected_features:
              lazy_load_elements: ">= 5"
              scroll_listeners: ">= 1"
              height_ratio: ">= 3.0"
              xhr_request_count: ">= 2"
            expected_type: "infinite_scroll"
            confidence_threshold: 0.85
            
          scenario_2:
            description: "Infinite scroll with load more button"
            url_pattern: "search?q={query}&infinite=true"
            expected_features:
              load_more_buttons: ">= 1"
              dynamic_content: ">= 3"
              scroll_velocity: "> 0"
            expected_type: "infinite_scroll"
            confidence_threshold: 0.8

    shopee:
      base_config:
        name: "Shopee Indonesia"
        language: "indonesian"
        encoding: "utf-8"
        base_url: "https://shopee.co.id/search?keyword={query}"
        
      selectors:
        pagination_buttons:
          high_confidence:
            - selector: "button[class*='shopee-button-outline'][class*='shopee-mini-page-controller']"
              priority: 10
              context: "shopee_pagination"
              weight: 0.95
            - selector: ".shopee-mini-page-controller__page"
              priority: 9
              context: "shopee_page_number"
              weight: 0.9
          medium_confidence:
            - selector: "button[aria-label*='Go to page']"
              priority: 7
              context: "shopee_aria_page"
              weight: 0.8
              
        next_buttons:
          high_confidence:
            - xpath: "//button[contains(@class, 'shopee-icon-button') and contains(@class, 'shopee-icon-button--right')]"
              priority: 10
              context: "shopee_next_arrow"
              weight: 0.95
            - xpath: "//button[contains(@aria-label, 'Next page')]"
              priority: 9
              context: "shopee_aria_next"
              weight: 0.9
              
        infinite_scroll_indicators:
          high_confidence:
            - selector: ".shopee-search-item-result__items"
              priority: 10
              context: "shopee_item_container"
              weight: 0.95
            - selector: "[class*='shopee-skeleton']"
              priority: 9
              context: "shopee_skeleton"
              weight: 0.9
              
      text_patterns:
        end_of_results:
          high_confidence:
            - pattern: "tidak\\s+ada\\s+hasil\\s+lagi"
              weight: 0.95
              feature_name: "shopee_no_more_results"
            - pattern: "akhir\\s+dari\\s+hasil\\s+pencarian"
              weight: 0.9
              feature_name: "shopee_end_search"
              
        pagination_text:
          high_confidence:
            - pattern: "halaman\\s+(\\d+)\\s+dari\\s+(\\d+)"
              weight: 0.95
              feature_name: "shopee_page_of_total"
              extract_numbers: true

    amazon:
      base_config:
        name: "Amazon"
        language: "english"
        encoding: "utf-8"
        base_url: "https://www.amazon.com/s?k={query}"
        
      selectors:
        pagination_buttons:
          high_confidence:
            - selector: ".s-pagination-item"
              priority: 10
              context: "amazon_pagination_item"
              weight: 0.95
            - selector: "a[aria-label*='Go to page']"
              priority: 9
              context: "amazon_aria_page"
              weight: 0.9
              
        next_buttons:
          high_confidence:
            - xpath: "//a[contains(@aria-label, 'Go to next page')]"
              priority: 10
              context: "amazon_aria_next"
              weight: 0.95
            - xpath: "//a[contains(text(), 'Next')]"
              priority: 9
              context: "amazon_text_next"
              weight: 0.9
              
      text_patterns:
        end_of_results:
          high_confidence:
            - pattern: "no\\s+more\\s+results"
              weight: 0.95
              feature_name: "amazon_no_more_results"
            - pattern: "end\\s+of\\s+results"
              weight: 0.9
              feature_name: "amazon_end_results"
              
        pagination_text:
          high_confidence:
            - pattern: "page\\s+(\\d+)\\s+of\\s+(\\d+)"
              weight: 0.95
              feature_name: "amazon_page_of_total"
              extract_numbers: true

  # === Generic E-commerce Patterns ===
  generic_ecommerce:
    common_selectors:
      pagination_buttons:
        - selector: ".pagination button, .pagination a"
          priority: 8
          context: "generic_pagination"
          weight: 0.8
        - selector: "[class*='page-'], [class*='pager-']"
          priority: 7
          context: "generic_page_class"
          weight: 0.7
          
      next_buttons:
        - xpath: "//button[contains(text(), 'Next') or contains(text(), 'next')]"
          priority: 8
          context: "generic_next_text"
          weight: 0.8
        - xpath: "//a[contains(text(), '›') or contains(text(), '→')]"
          priority: 7
          context: "generic_arrow"
          weight: 0.7
          
      infinite_scroll_indicators:
        - selector: "[data-infinite-scroll], [class*='infinite-scroll']"
          priority: 9
          context: "generic_infinite_scroll"
          weight: 0.9
        - selector: "[class*='loading'], [class*='spinner'], [class*='skeleton']"
          priority: 8
          context: "generic_loading"
          weight: 0.8
          
    common_text_patterns:
      end_of_results:
        - pattern: "no\\s+more\\s+(results|items|products)"
          weight: 0.8
          feature_name: "generic_no_more"
        - pattern: "end\\s+of\\s+(results|list|page)"
          weight: 0.8
          feature_name: "generic_end"
        - pattern: "that's\\s+all"
          weight: 0.7
          feature_name: "generic_thats_all"
          
      pagination_text:
        - pattern: "page\\s+(\\d+)\\s+of\\s+(\\d+)"
          weight: 0.8
          feature_name: "generic_page_of_total"
          extract_numbers: true
        - pattern: "showing\\s+(\\d+)\\s+of\\s+(\\d+)"
          weight: 0.8
          feature_name: "generic_showing_of"
          extract_numbers: true

# === Advanced Feature Extraction Templates ===
advanced_features:
  # Dynamic content monitoring
  dynamic_content:
    scroll_behavior:
      track_velocity: true
      track_acceleration: true
      velocity_threshold: 100  # pixels per second
      acceleration_threshold: 50  # pixels per second squared
      
    dom_monitoring:
      track_node_additions: true
      significant_change_threshold: 10
      monitor_attribute_changes: true
      
    network_activity:
      monitor_xhr_requests: true
      track_image_loads: true
      request_timeout_window: 5000  # milliseconds
      
    user_interaction:
      monitor_scroll_events: true
      track_click_patterns: true
      detect_hover_effects: true
      
  # Performance monitoring
  performance_monitoring:
    track_extraction_time: true
    track_prediction_time: true
    memory_usage_monitoring: false
    
  # Enhanced text analysis
  text_analysis:
    sentiment_analysis: false
    language_detection: true
    keyword_density: true
    readability_score: false
    
# === Training Data Quality Control ===
quality_control:
  data_validation:
    min_features_required: 15
    min_text_length: 100
    max_extraction_time: 5.0  # seconds
    required_feature_categories: ["navigation", "content", "text"]
    
  sampling_strategy:
    balanced_sampling: true
    oversample_minority_class: true
    undersample_majority_class: false
    stratify_by_site: true
    
  feature_engineering:
    normalize_numeric_features: true
    create_interaction_features: true
    polynomial_features: false
    feature_selection: true
    
# === Model Training Configuration ===
model_training:
  algorithms:
    primary: "RandomForestClassifier"
    alternatives: ["GradientBoostingClassifier", "SVM", "LogisticRegression"]
    
  hyperparameters:
    RandomForestClassifier:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, None]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      
  cross_validation:
    cv_folds: 5
    scoring: ["accuracy", "f1_macro", "precision_macro", "recall_macro"]
    
  feature_importance:
    calculate_permutation_importance: true
    plot_feature_importance: true
    save_feature_rankings: true

# === Deployment Configuration ===
deployment:
  model_versioning:
    save_model_versions: true
    max_versions_to_keep: 5
    version_naming: "timestamp"
    
  monitoring:
    track_prediction_confidence: true
    log_low_confidence_predictions: true
    alert_on_model_drift: true
    
  fallback_strategies:
    use_rule_based_fallback: true
    confidence_threshold_for_fallback: 0.7
    escalate_to_human_review: false