# E-commerce Feature Template
# Optimized for online shopping sites with product listings

template_name: "ecommerce_pagination"
description: "Template for e-commerce pagination detection with product-focused features"
version: "1.0"
author: "Enhanced Analyzer System"

# Core selectors for e-commerce sites
selectors:
  pagination_buttons:
    primary:
      - selector: ".pagination button:not([disabled])"
        priority: 10
        context: "ecommerce_pagination"
      - selector: "nav[aria-label*='pagination'] button"
        priority: 9
        context: "ecommerce_semantic_nav"
    
    secondary:
      - selector: ".pager button, .page-nav button"
        priority: 7
        context: "ecommerce_pager"
      - selector: "button[aria-label*='page']"
        priority: 6
        context: "ecommerce_aria_page"
  
  next_buttons:
    primary:
      - xpath: "//button[contains(@aria-label, 'next') or contains(@aria-label, 'Next')]"
        priority: 10
        context: "ecommerce_next_aria"
      - xpath: "//a[contains(@aria-label, 'next') or contains(@aria-label, 'Next')]"
        priority: 9
        context: "ecommerce_next_link"
    
    secondary:
      - xpath: "//button[contains(text(), 'Next') or contains(text(), '›') or contains(text(), '→')]"
        priority: 8
        context: "ecommerce_next_text"
      - selector: ".next-page, .btn-next"
        priority: 7
        context: "ecommerce_next_class"
  
  load_more_buttons:
    primary:
      - xpath: "//button[contains(text(), 'Load More') or contains(text(), 'Show More')]"
        priority: 10
        context: "ecommerce_load_more"
      - selector: "button[data-testid*='load-more'], button[data-testid*='show-more']"
        priority: 9
        context: "ecommerce_load_more_testid"
    
    secondary:
      - selector: ".load-more-btn, .show-more-btn, .view-more-btn"
        priority: 7
        context: "ecommerce_load_more_class"
  
  product_elements:
    primary:
      - selector: ".product-item, .product-card"
        priority: 10
        context: "ecommerce_product_card"
      - selector: "[data-testid*='product'], [data-testid*='item']"
        priority: 9
        context: "ecommerce_product_testid"
    
    secondary:
      - selector: ".listing-item, .search-result-item"
        priority: 8
        context: "ecommerce_listing"
      - selector: "[class*='product']:not([class*='product-detail'])"
        priority: 7
        context: "ecommerce_product_class"
    
    fallback:
      - selector: "article, .item"
        priority: 5
        context: "ecommerce_semantic_fallback"
  
  lazy_load_elements:
    images:
      - selector: "img[data-src]:not([src]), img[data-lazy]"
        priority: 10
        context: "ecommerce_lazy_images"
      - selector: "img[loading='lazy']"
        priority: 9
        context: "ecommerce_native_lazy"
    
    content:
      - selector: ".skeleton, .shimmer, .placeholder"
        priority: 10
        context: "ecommerce_loading_placeholder"
      - selector: ".loading-spinner, .loader"
        priority: 9
        context: "ecommerce_spinner"

# E-commerce specific text patterns
text_patterns:
  pagination_indicators:
    strong_indicators:
      - pattern: "page \\d+ of \\d+"
        weight: 0.95
        feature_name: "ecommerce_page_of_total"
      - pattern: "showing \\d+-\\d+ of [\\d,]+ (products|items|results)"
        weight: 0.9
        feature_name: "ecommerce_showing_range"
      - pattern: "\\d+ - \\d+ of [\\d,]+ (products|items)"
        weight: 0.85
        feature_name: "ecommerce_range_display"
    
    weak_indicators:
      - pattern: "\\d+ (products|items) found"
        weight: 0.6
        feature_name: "ecommerce_total_found"
      - pattern: "(products|items) \\d+-\\d+"
        weight: 0.5
        feature_name: "ecommerce_range_simple"
  
  end_of_results:
    high_confidence:
      - pattern: "no more (products|items|results)"
        weight: 0.9
        feature_name: "ecommerce_no_more"
      - pattern: "end of (products|catalog|results)"
        weight: 0.85
        feature_name: "ecommerce_end_of"
    
    medium_confidence:
      - pattern: "all (products|items) shown"
        weight: 0.7
        feature_name: "ecommerce_all_shown"
      - pattern: "that's all we have"
        weight: 0.6
        feature_name: "ecommerce_thats_all"
  
  infinite_scroll_indicators:
    - pattern: "loading more (products|items)"
      weight: 0.8
      feature_name: "ecommerce_loading_more"
    - pattern: "scroll for more"
      weight: 0.7
      feature_name: "ecommerce_scroll_more"

# Dynamic features optimized for e-commerce
dynamic_features:
  scroll_behavior:
    track_velocity: true
    track_acceleration: false  # Not critical for e-commerce
    velocity_window: 5
    detect_smooth_scrolling: true
  
  dom_monitoring:
    track_node_additions: true
    track_node_removals: false
    monitor_attribute_changes: false
    significant_change_threshold: 5  # Products typically load in batches
  
  network_activity:
    monitor_xhr_requests: true
    monitor_fetch_requests: true
    track_image_loads: true  # Important for product images
    request_timeout_window: 5000

# E-commerce specific thresholds
thresholds:
  confidence_threshold: 0.7
  footer_threshold_ratio: 0.85  # E-commerce sites often have large footers
  scroll_bottom_threshold: 0.9
  max_infinite_scroll_rounds: 20  # E-commerce can have many products
  consecutive_infinite_limit: 8

# Feature weights for e-commerce scenarios
feature_weights:
  pagination_buttons: 1.2
  product_elements: 1.5  # Very important for e-commerce
  lazy_load_elements: 1.3
  text_patterns: 1.1
  url_params: 1.2

# Performance settings for e-commerce
performance:
  page_load_timeout: 30  # E-commerce sites can be slow
  element_wait_timeout: 10
  scroll_pause_time: 2.5  # Allow time for product images to load