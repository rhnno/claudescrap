# Infinite Scroll Feature Template
# Optimized for sites with infinite scroll pagination (social media, feeds, etc.)

template_name: "infinite_scroll_detection"
description: "Template for infinite scroll pagination detection with dynamic loading features"
version: "1.0"
author: "Enhanced Analyzer System"

# Core selectors for infinite scroll sites
selectors:
  pagination_buttons:
    # Minimal pagination buttons (infinite scroll sites rarely have them)
    fallback:
      - selector: ".pagination button"
        priority: 3
        context: "infinite_fallback_pagination"
  
  next_buttons:
    # Minimal next buttons
    fallback:
      - xpath: "//button[contains(text(), 'Next')]"
        priority: 3
        context: "infinite_fallback_next"
  
  load_more_buttons:
    primary:
      - xpath: "//button[contains(text(), 'Load More') or contains(text(), 'Show More')]"
        priority: 10
        context: "infinite_load_more"
      - xpath: "//button[contains(text(), 'See More') or contains(text(), 'View More')]"
        priority: 9
        context: "infinite_see_more"
      - selector: "button[data-testid*='load-more'], button[data-testid*='show-more']"
        priority: 8
        context: "infinite_load_more_testid"
    
    secondary:
      - selector: ".load-more, .show-more, .view-more"
        priority: 7
        context: "infinite_load_more_class"
      - selector: "button[aria-label*='load'], button[aria-label*='more']"
        priority: 6
        context: "infinite_load_more_aria"
  
  product_elements:  # Content items for infinite scroll
    primary:
      - selector: "[data-testid*='post'], [data-testid*='item'], [data-testid*='card']"
        priority: 10
        context: "infinite_content_testid"
      - selector: ".feed-item, .stream-item, .timeline-item"
        priority: 9
        context: "infinite_feed_items"
    
    secondary:
      - selector: ".post, .item, .card, .entry"
        priority: 8
        context: "infinite_content_generic"
      - selector: "[data-id], [data-post-id], [data-item-id]"
        priority: 7
        context: "infinite_content_data"
    
    fallback:
      - selector: "article, section"
        priority: 5
        context: "infinite_semantic_fallback"
  
  lazy_load_elements:
    images:
      - selector: "img[data-src]:not([src]), img[data-lazy]"
        priority: 10
        context: "infinite_lazy_images"
      - selector: "img[loading='lazy']"
        priority: 9
        context: "infinite_native_lazy"
      - selector: "img[src*='placeholder'], img[src*='loading']"
        priority: 8
        context: "infinite_placeholder_images"
    
    content:
      - selector: ".skeleton, .shimmer, .loading-placeholder"
        priority: 10
        context: "infinite_loading_skeleton"
      - selector: ".spinner, .loader, .loading-indicator"
        priority: 9
        context: "infinite_loading_spinner"
      - selector: "[data-loading], [data-placeholder]"
        priority: 8
        context: "infinite_loading_data"
    
    containers:
      - selector: ".infinite-scroll-container, .lazy-container"
        priority: 10
        context: "infinite_scroll_container"
      - selector: "[data-infinite-scroll], [data-lazy-load]"
        priority: 9
        context: "infinite_scroll_data"

# Infinite scroll specific text patterns
text_patterns:
  infinite_scroll_indicators:
    strong_indicators:
      - pattern: "loading more|loading additional|fetching more"
        weight: 0.95
        feature_name: "infinite_loading_more"
      - pattern: "scroll (for|to see) more|keep scrolling"
        weight: 0.9
        feature_name: "infinite_scroll_instruction"
      - pattern: "infinite scroll|endless scroll|continuous loading"
        weight: 0.85
        feature_name: "infinite_scroll_explicit"
    
    medium_indicators:
      - pattern: "loading\\.\\.\\.|please wait|fetching"
        weight: 0.7
        feature_name: "infinite_loading_generic"
      - pattern: "more (content|posts|items|results)"
        weight: 0.6
        feature_name: "infinite_more_content"
  
  end_of_results:
    high_confidence:
      - pattern: "no more (content|posts|items|results)"
        weight: 0.95
        feature_name: "infinite_no_more"
      - pattern: "you've reached the end|end of (feed|timeline|stream)"
        weight: 0.9
        feature_name: "infinite_reached_end"
      - pattern: "that's all|nothing more to show"
        weight: 0.85
        feature_name: "infinite_thats_all"
    
    medium_confidence:
      - pattern: "all caught up|you're all set"
        weight: 0.7
        feature_name: "infinite_caught_up"
      - pattern: "no (new|additional) (content|posts|items)"
        weight: 0.65
        feature_name: "infinite_no_new"
  
  loading_indicators:
    - pattern: "loading|please wait|fetching|processing"
      weight: 0.8
      feature_name: "infinite_loading_text"
    - pattern: "\\.\\.\\.|…|loading\\s*\\.\\.\\."
      weight: 0.7
      feature_name: "infinite_loading_dots"

# Dynamic features heavily optimized for infinite scroll
dynamic_features:
  scroll_behavior:
    track_velocity: true
    track_acceleration: true  # Important for infinite scroll
    velocity_window: 5
    detect_smooth_scrolling: true  # Critical for infinite scroll detection
  
  dom_monitoring:
    track_node_additions: true  # Critical for infinite scroll
    track_node_removals: false
    monitor_attribute_changes: true  # Important for loading states
    significant_change_threshold: 1  # Very sensitive for infinite scroll
  
  network_activity:
    monitor_xhr_requests: true  # Critical for infinite scroll
    monitor_fetch_requests: true  # Critical for modern infinite scroll
    track_image_loads: true
    request_timeout_window: 2000  # Shorter window for responsive infinite scroll
  
  user_interaction:
    detect_hover_effects: false
    track_focus_changes: false
    monitor_scroll_events: true  # Critical for infinite scroll

# Infinite scroll specific thresholds
thresholds:
  confidence_threshold: 0.6  # Lower threshold due to dynamic nature
  footer_threshold_ratio: 0.95  # Very high since infinite scroll rarely has footer pagination
  scroll_bottom_threshold: 0.85  # Trigger before reaching absolute bottom
  max_infinite_scroll_rounds: 50  # Much higher for infinite scroll
  consecutive_infinite_limit: 20  # Higher limit for infinite scroll
  
  # Adaptive thresholds for infinite scroll
  adaptive_thresholds:
    enable: true
    confidence_decay: 0.02  # Slower decay for infinite scroll
    min_confidence: 0.3
    scroll_patience: 5  # More patience for infinite scroll

# Feature weights heavily favoring infinite scroll indicators
feature_weights:
  lazy_load_elements: 2.0  # Very important
  scroll_velocity: 1.8
  xhr_request_count: 1.7
  new_dom_nodes: 1.6
  significant_dom_change: 1.5
  load_more_buttons: 1.4
  pagination_buttons: 0.3  # Very low importance
  next_button: 0.3  # Very low importance
  numbered_buttons: 0.2  # Very low importance

# Performance settings optimized for infinite scroll
performance:
  page_load_timeout: 20  # Shorter since infinite scroll sites are usually fast
  element_wait_timeout: 5
  scroll_pause_time: 1.5  # Shorter pauses for responsive infinite scroll

# Special infinite scroll detection rules
infinite_scroll_rules:
  # Minimum scroll velocity to consider infinite scroll active
  min_scroll_velocity: 100  # pixels per second
  
  # Maximum time between scroll and new content for infinite scroll
  max_content_delay: 5000  # milliseconds
  
  # Minimum new DOM nodes to consider significant infinite scroll activity
  min_new_nodes_threshold: 3
  
  # Minimum XHR requests to indicate infinite scroll activity
  min_xhr_requests: 1
  
  # Scroll percentage thresholds for triggering infinite scroll detection
  scroll_trigger_thresholds: [0.7, 0.8, 0.9, 0.95]