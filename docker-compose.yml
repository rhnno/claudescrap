version: '3.8'

services:
  # Enhanced ML-Powered Web Scraper
  enhanced-analyzer:
    build: 
      context: .
      dockerfile: dockerfile
    container_name: enhanced_ml_analyzer
    restart: unless-stopped
    
    # Resource allocation for ML workloads
    cpus: "4.0"
    mem_limit: 6g
    shm_size: 2g
    
    environment:
      # Core settings
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - PYTHONPATH=/app
      
      # Analyzer configuration
      - ANALYZER_CONFIG_PATH=/app/config/enhanced_analyzer_config.yaml
      - ANALYZER_DEBUG_LEVEL=INFO
      - ANALYZER_MODEL_DIR=/app/models
      
      # Scraping parameters
      - MAX_PAGES=50
      - SCRAPE_INTERVAL=7200
      - TRAINING_INTERVAL=86400
      
      # Performance tuning
      - CHROME_OPTIONS=--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--remote-debugging-port=9222
      - ML_WORKERS=2
      - FEATURE_CACHE_SIZE=1000
      
      # Site configurations
      - DEFAULT_SITE=tokopedia
      - ENABLE_MULTI_SITE=true
      - AUTO_TRAIN_MODEL=true
      
      # Data collection
      - COLLECT_TRAINING_DATA=true
      - MIN_TRAINING_SAMPLES=100
      - MAX_TRAINING_SAMPLES=2000
      
      # Monitoring
      - ENABLE_PERFORMANCE_MONITORING=true
      - LOG_FEATURE_EXTRACTION=true
      - SAVE_FEATURE_ANALYSIS=true

    volumes:
      # Persistent data storage
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      
      # Configuration (can be overridden)
      - ./config:/app/config
      
      # Optional: Custom templates
      - ./config/feature_templates:/app/config/feature_templates
      
      # System
      - /etc/localtime:/etc/localtime:ro
      - /dev/shm:/dev/shm

    ports:
      - "4000:4000"    # Main application port
      - "8080:8080"    # Monitoring/API port
      - "9222:9222"    # Chrome debugging port (optional)

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 120s

    networks:
      - analyzer-network

    # Dependencies for multi-container setup (optional)
    depends_on:
      - redis
      - mongodb

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: analyzer_redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - analyzer-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB for storing training data and results
  mongodb:
    image: mongo:7
    container_name: analyzer_mongodb
    restart: unless-stopped
    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=analyzer
      - MONGO_INITDB_ROOT_PASSWORD=analyzer_password_2024
      - MONGO_INITDB_DATABASE=analyzer_db
    
    volumes:
      - mongodb_data:/data/db
      - ./docker-configs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    
    ports:
      - "27017:27017"
    
    networks:
      - analyzer-network
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Jupyter notebook for analysis and development
  jupyter:
    build: 
      context: .
      dockerfile: dockerfile
    container_name: analyzer_jupyter
    restart: unless-stopped
    
    command: >
      bash -c "
        pip install jupyter jupyterlab notebook &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root 
        --NotebookApp.token='' --NotebookApp.password=''
      "
    
    environment:
      - PYTHONPATH=/app
      - JUPYTER_ENABLE_LAB=yes
    
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
      - ./func:/app/func
      - ./notebooks:/app/notebooks
    
    ports:
      - "8888:8888"
    
    networks:
      - analyzer-network
    
    profiles:
      - development

  # Optional: Monitoring with Grafana (for production)
  grafana:
    image: grafana/grafana:latest
    container_name: analyzer_grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_password_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker-configs/grafana-dashboards:/etc/grafana/provisioning/dashboards
    
    ports:
      - "3000:3000"
    
    networks:
      - analyzer-network
    
    profiles:
      - monitoring

networks:
  analyzer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  grafana_data:
    driver: local
