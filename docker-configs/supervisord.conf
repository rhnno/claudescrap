[supervisord]
nodaemon=true
user=appuser
logfile=/app/logs/supervisord.log
pidfile=/app/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb.log

[program:analyzer]
command=python /app/main.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/analyzer.log
stderr_logfile=/app/logs/analyzer.log
environment=DISPLAY=":99",PYTHONPATH="/app"

[unix_http_server]
file=/app/supervisor.sock

[supervisorctl]
serverurl=unix:///app/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface