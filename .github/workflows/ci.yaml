name: CI - Security & Quality Check

on:
  push:
    branches: [ main, "refactor/*" ]
  pull_request:
    branches: [ main ]


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit flake8

      - name: Security check - CVE scan (dependencies)
        run: |
          pip-audit -r requirements.txt

      - name: Security check - Static analysis (code)
        run: |
          bandit -r src/ -ll --exclude src/tests

      - name: Lint check
        run: |
          flake8 src/ --max-line-length=100 --exclude=src/tests --count --statistics