# CI/CD configuration for testing ScraperService
name: ScraperService CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  # Test environment variables
  JWT_SECRET_KEY: test-secret-key-for-ci
  DATABASE_URL: sqlite:///test.db

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    services:
      # Optional MongoDB service for integration tests
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install all requirements files in proper order
        pip install -r requirements.txt
        pip install -r requirements_api.txt
        pip install -r requirements_test.txt
        # Ensure coverage is available
        pip install coverage
    
    - name: Debug CI environment
      run: |
        python ci_debug.py
      continue-on-error: true
    
    - name: Install Chrome for Selenium tests
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Install ChromeDriver
      run: |
        # Get Chrome version
        CHROME_VERSION=$(google-chrome --version | cut -d " " -f3)
        echo "Chrome version: $CHROME_VERSION"
        
        # Use Chrome for Testing API to get compatible ChromeDriver
        CHROMEDRIVER_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" | \
          python3 -c "import sys, json; data=json.load(sys.stdin); versions=[v for v in data['versions'] if v['version'].startswith('$CHROME_VERSION'.split('.')[0])]; print(versions[-1]['downloads']['chromedriver'][0]['url'] if versions and 'chromedriver' in versions[-1]['downloads'] else '')" 2>/dev/null)
        
        # Fallback to latest stable if specific version not found
        if [ -z "$CHROMEDRIVER_URL" ]; then
          echo "Using latest stable ChromeDriver"
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chromedriver-linux64.zip"
        fi
        
        echo "Downloading ChromeDriver from: $CHROMEDRIVER_URL"
        wget -O /tmp/chromedriver.zip "$CHROMEDRIVER_URL"
        sudo unzip /tmp/chromedriver.zip -d /tmp/
        sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/ || sudo mv /tmp/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version
    
    - name: Verify Chrome and ChromeDriver installation
      run: |
        google-chrome --version
        chromedriver --version
        which chromedriver
        echo "Chrome and ChromeDriver installation verified"
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type checking with mypy
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports --no-strict-optional
    
    - name: Run unit tests
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        python -m pytest tests/test_scraper_service.py -v --tb=short --timeout=300 --no-cov
    
    - name: Run integration tests
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        python -m pytest tests/test_integration.py -v --tb=short --timeout=600 --no-cov
    
    - name: Run API tests
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        python -m pytest tests/test_api.py -v --tb=short --timeout=300 --no-cov
    
    - name: Run all tests with coverage
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        coverage run -m pytest tests/test_scraper_service.py -v --tb=short --timeout=300
        coverage report --show-missing
        coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install security tools
      run: |
        pip install safety bandit
    
    - name: Run safety check
      run: |
        safety check --json || true
    
    - name: Run bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_api.txt
        pip install -r requirements_test.txt
    
    - name: Run performance tests
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        python -m pytest tests/ -k "performance" --benchmark-only --benchmark-json=benchmark.json || true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark.json

  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
        exclude:
          # Exclude some combinations to reduce CI time
          - os: macos-latest
            python-version: "3.10"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_api.txt
        pip install -r requirements_test.txt
    
    - name: Run core tests (no browser)
      run: |
        export PYTHONPATH="$PWD/src:$PYTHONPATH"
        python -m pytest tests/test_scraper_service.py::TestScraperServiceInitialization -v --timeout=300 --no-cov
      shell: bash

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build test Docker image
      run: |
        docker build -t claudescrap-test -f - . <<EOF
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements*.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        RUN pip install --no-cache-dir -r requirements_api.txt  
        RUN pip install --no-cache-dir -r requirements_test.txt
        COPY src/ ./src/
        COPY tests/ ./tests/
        COPY pytest.ini ./
        ENV PYTHONPATH=/app/src
        CMD ["python", "-m", "pytest", "tests/test_scraper_service.py", "-v", "--tb=short", "--no-cov"]
        EOF
    
    - name: Run tests in Docker
      run: |
        docker run --rm claudescrap-test

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, test-matrix, docker-test]
    if: always()
    
    steps:
    - name: Determine overall status
      id: status
      run: |
        # Check results of all jobs
        TEST_RESULT="${{ needs.test.result }}"
        SECURITY_RESULT="${{ needs.security-scan.result }}"
        MATRIX_RESULT="${{ needs.test-matrix.result }}"
        DOCKER_RESULT="${{ needs.docker-test.result }}"
        
        echo "Test job: $TEST_RESULT"
        echo "Security scan: $SECURITY_RESULT"
        echo "Matrix test: $MATRIX_RESULT"
        echo "Docker test: $DOCKER_RESULT"
        
        # Determine overall status
        if [[ "$TEST_RESULT" == "success" && "$SECURITY_RESULT" == "success" ]]; then
          echo "overall_status=success" >> $GITHUB_OUTPUT
          echo "✅ Core CI pipeline passed"
        else
          echo "overall_status=failure" >> $GITHUB_OUTPUT
          echo "❌ Core CI pipeline failed"
        fi
    
    - name: Notify on success
      if: steps.status.outputs.overall_status == 'success'
      run: |
        echo "🎉 ScraperService CI/CD Pipeline - SUCCESS"
        echo "✅ All core tests passed!"
        echo "✅ Security scans completed successfully!"
        echo "📊 Coverage reports generated"
        echo "🚀 Ready for deployment"
        # TODO: Add Slack/Discord webhook notification here
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"✅ ScraperService CI/CD SUCCESS"}' \
        #   $SLACK_WEBHOOK_URL
    
    - name: Notify on failure
      if: steps.status.outputs.overall_status == 'failure'
      run: |
        echo "💥 ScraperService CI/CD Pipeline - FAILURE"
        echo "❌ One or more critical jobs failed!"
        echo "🔍 Check the logs for details:"
        echo "   - Test results: ${{ needs.test.result }}"
        echo "   - Security scan: ${{ needs.security-scan.result }}"
        echo "   - Matrix tests: ${{ needs.test-matrix.result }}"
        echo "   - Docker tests: ${{ needs.docker-test.result }}"
        echo "🛠️  Review and fix issues before retrying"
        # TODO: Add Slack/Discord webhook notification here
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"❌ ScraperService CI/CD FAILED - Check GitHub Actions"}' \
        #   $SLACK_WEBHOOK_URL
        exit 1